name: GHCR Token Verify
on: workflow_dispatch
permissions:
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          RESP=$(curl -s -u "x-access-token:$GITHUB_TOKEN" "https://ghcr.io/token?service=ghcr.io&scope=repository:yyichenn/oauth-test:pull,push")

          echo "=== Response fields ==="
          echo "$RESP" | jq 'keys'
          echo "has expires_in: $(echo "$RESP" | jq 'has("expires_in")')"

          TOKEN=$(echo "$RESP" | jq -r '.token // empty')
          echo "=== Token stats ==="
          echo "Token length: ${#TOKEN}"
          echo "GITHUB_TOKEN length: ${#GITHUB_TOKEN}"

          echo "=== Format check ==="
          echo "Token starts with 'eyJ': $(echo "$TOKEN" | grep -q '^eyJ' && echo yes || echo no)"
          echo "Token has 2 dots (JWT): $(echo "$TOKEN" | grep -qP '^[^.]+\.[^.]+\.[^.]+$' && echo yes || echo no)"

          DECODED=$(echo "$TOKEN" | base64 -d 2>/dev/null)
          echo "=== Decoded comparison ==="
          echo "Decoded length: ${#DECODED}"
          echo "Decoded starts with 'ghs_': $(echo "$DECODED" | grep -q '^ghs_' && echo yes || echo no)"
          echo "Decoded == GITHUB_TOKEN: $([ "$DECODED" = "$GITHUB_TOKEN" ] && echo YES || echo NO)"

          echo "=== Prefix fingerprint (safe to show) ==="
          echo "GITHUB_TOKEN first 4 chars: ${GITHUB_TOKEN:0:4}"
          echo "Decoded token first 4 chars: ${DECODED:0:4}"
          echo "Token (raw) first 8 chars: ${TOKEN:0:8}"

          echo "=== SHA256 comparison (proves equality without exposing) ==="
          GT_HASH=$(echo -n "$GITHUB_TOKEN" | sha256sum | cut -d' ' -f1)
          DEC_HASH=$(echo -n "$DECODED" | sha256sum | cut -d' ' -f1)
          echo "SHA256(GITHUB_TOKEN): $GT_HASH"
          echo "SHA256(decoded token): $DEC_HASH"
          echo "Hashes match: $([ "$GT_HASH" = "$DEC_HASH" ] && echo YES || echo NO)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
